version: '3.8'

services:
  ellora-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ellora-web
    restart: always
    ports:
      - "3000:3000"
      - "80:3000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
